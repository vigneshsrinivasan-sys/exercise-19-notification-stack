<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 19 — Notification Stack</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <section class="notifications">
        <div class="alert unread">
          <h3>New Message</h3>
          <p>You’ve received a new message from Sarah.</p>
        </div>
        <div class="alert">
          <h3>Weekly Report Ready</h3>
          <p>Your team’s performance summary is now available.</p>
        </div>
        <div class="alert">
          <h3>System Update Completed</h3>
          <p>Version 4.8.1 has been successfully installed.</p>
        </div>
      </section>
    </main>
  </body>
</html>
